<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#67758d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BKK Airwaves">
<title>BKK Airwaves — iPod Fit</title>
<style>
:root{
  --body1:#78869e; --body2:#5e6a80; --screen1:#163a5f; --screen2:#0c223b;
  --white:#f7f9fc; --muted:#bbcae0; --wheel:#191e27; --wheel2:#282f3d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151d;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100dvh}
.app{
  width:100vw;height:100dvh;
  padding:max(env(safe-area-inset-top),8px) 10px max(env(safe-area-inset-bottom),8px);
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#121722,#0d1118);
}
.ipod{
  width:min(94vw,470px);
  height:min(calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 16px),900px);
  min-height:620px;
  border-radius:clamp(28px,7vw,50px);
  padding:clamp(12px,3.6vw,22px);
  display:grid;
  grid-template-rows:minmax(340px,49%) 1fr auto;
  gap:clamp(10px,2.2vh,18px);
  background:linear-gradient(180deg,var(--body1),var(--body2));
  box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.26);
}
.screen-frame{min-height:0;background:#111720;border-radius:26px;padding:8px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)}
.screen{
  height:100%;min-height:0;border-radius:19px;padding:12px;color:var(--white);overflow:hidden;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.13),transparent 26%),
    linear-gradient(180deg,var(--screen1),var(--screen2));
  display:grid;grid-template-rows:auto auto auto 1fr;
  gap:8px;
}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#dce7f5}
.nowrow{display:grid;grid-template-columns:31% 1fr;gap:12px;min-height:0}
.visual{
  width:100%;aspect-ratio:1/1;border-radius:12px;
  background:linear-gradient(180deg,#0a1b30,#0d3558);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.info{min-width:0;display:flex;flex-direction:column;justify-content:center}
.label{font-size:11px;color:#dce7f5;margin-bottom:3px}
.station{font-size:clamp(20px,6vw,31px);line-height:1.0;font-weight:800;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.freq{font-size:14px;color:var(--muted);margin-top:6px}
.quality{font-size:10px;color:#9fb3ce;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livebar{height:6px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
.livebar:before{content:"";display:block;height:100%;width:68%;background:#f5f8fc;border-radius:999px}
.status{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#b8c9df}
.status b{color:#fff;font-weight:650}
.picker{
  min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;
  scrollbar-width:none;
}
.picker::-webkit-scrollbar{display:none}
.stbtn{
  appearance:none;border:1px solid rgba(255,255,255,.11);border-radius:10px;
  background:rgba(255,255,255,.055);color:#f1f5fb;padding:7px 8px;text-align:left;min-height:42px
}
.stbtn.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25)}
.stbtn .n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbtn .f{font-size:9px;color:#b8c9dd;margin-top:2px}
.wheel-area{display:flex;align-items:center;justify-content:center;min-height:0}
.wheel{
  width:min(64vw,335px,33vh);height:min(64vw,335px,33vh);
  min-width:220px;min-height:220px;
  position:relative;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,var(--wheel2),var(--wheel));
  box-shadow:inset 0 2px 2px rgba(255,255,255,.04),inset 0 -10px 18px rgba(0,0,0,.28),0 10px 18px rgba(25,32,43,.2)
}
.center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:39%;height:39%;border:0;border-radius:50%;color:#fff;
  background:radial-gradient(circle at 40% 35%,#2c3544,#171d27);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.05),inset 0 -10px 16px rgba(0,0,0,.28);
  display:grid;place-items:center
}
.playIcon{
  width:0;height:0;
  border-top:18px solid transparent;
  border-bottom:18px solid transparent;
  border-left:28px solid #fff;
  margin-left:7px;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.14))
}
.pauseIcon{
  width:34px;height:38px;
  display:flex;align-items:center;justify-content:space-between;
}
.pauseIcon::before,.pauseIcon::after{
  content:"";display:block;width:12px;height:38px;border-radius:5px;background:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.12)
}
.wbtn{position:absolute;border:0;background:transparent;color:#f5f7fb;font-weight:650}
.menu{left:50%;top:8%;transform:translateX(-50%);font-size:12px;letter-spacing:.08em}
.prev{left:8%;top:50%;transform:translateY(-50%);font-size:28px}
.next{right:8%;top:50%;transform:translateY(-50%);font-size:28px}
.pp{left:50%;bottom:7%;transform:translateX(-50%);font-size:26px}
.bottom{
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  color:#edf2f8;font-size:10px;padding:0 4px
}
.sleepwrap{display:flex;flex-direction:column;gap:5px}
.sleeplabel{
  font-size:9px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.74);
  padding-left:2px
}
.sleep{display:flex;gap:6px}
.sleep button{
  border:0;border-radius:999px;padding:7px 10px;
  background:rgba(255,255,255,.16);color:#fff;font-size:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.12);
  transition:transform .08s ease, box-shadow .08s ease, background .08s ease
}
.sleep button:active{
  transform:translateY(1px) scale(.97);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.36);
}
.sleep button.active{
  background:rgba(255,255,255,.30);
  transform:translateY(1px) scale(.97);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.16)
}
.hardware{opacity:.78;text-align:right}
@media (max-height:720px){
  .ipod{grid-template-rows:minmax(300px,49%) 1fr auto;gap:8px}
  .screen{padding:10px;gap:6px}
  .picker{grid-template-columns:repeat(3,1fr)}
  .stbtn{min-height:36px;padding:5px 6px}
  .stbtn .n{font-size:10px}.stbtn .f{font-size:8px}
}
</style>
</head>
<body>
<div class="app">
  <main class="ipod">
    <section class="screen-frame">
      <div class="screen">
        <div class="top"><span>BKK Airwaves</span><span>LIVE · Bangkok</span></div>

        <div class="nowrow">
          <canvas id="visualizer" class="visual" width="320" height="320"></canvas>
          <div class="info">
            <div class="label">Now Playing</div>
            <div class="station" id="heroName">Choose station</div>
            <div class="freq" id="heroFreq">Bangkok radio</div>
            <div class="quality" id="heroQuality">Ready</div>
          </div>
        </div>

        <div>
          <div class="livebar"></div>
          <div class="status"><span id="statusMain"><b>Ready</b></span><span id="statusSub">Tap a station</span></div>
        </div>

        <div class="picker" id="stationGrid"></div>
      </div>
    </section>

    <section class="wheel-area">
      <div class="wheel">
        <button class="wbtn menu" onclick="showStationMenu()">MENU</button>
        <button class="wbtn prev" onclick="prevStation()">⏮</button>
        <button class="wbtn next" onclick="nextStation()">⏭</button>
        <button class="wbtn pp" onclick="togglePlay()">⏯</button>
        <button class="center" id="centerBtn" onclick="togglePlay()"><span class="playIcon"></span></button>
      </div>
    </section>

    <div class="bottom">
      <div class="sleepwrap">
        <div class="sleeplabel">SLEEP</div>
        <div class="sleep">
          <button id="sleep15" onclick="setSleep(15,this)">15m</button>
          <button id="sleep30" onclick="setSleep(30,this)">30m</button>
          <button id="sleep60" onclick="setSleep(60,this)">60m</button>
        </div>
      </div>
      <div class="hardware">BKK Airwaves · xaus1977</div>
    </div>

    <audio id="player" playsinline preload="none"></audio>
  </main>
</div>

<script>
const WORKER = "https://met107-radio.xaus1977.workers.dev";

const stations = [
  {name:"COOLfahrenheit",freq:"93.0 FM",quality:"MP3 · DIRECT",type:"stream",url:"https://coolism-web.cdn.byteark.com/;stream/1"},
  {name:"Green Wave",freq:"106.5 FM",quality:"HLS · DIRECT",type:"stream",url:"https://atimevideo.smartclick.co.th/live/greenlive.sdp/chunklist.m3u8"},
  {name:"MET 107",freq:"107.0 FM",quality:"HTTPS · PROXY",type:"stream",url:WORKER+"/"},
  {name:"Flex 104.5",freq:"104.5 FM",quality:"OFFICIAL WEB",type:"external",url:"https://www.flexconnect.net/"},
  {name:"EFM",freq:"94.0 FM",quality:"HLS · DIRECT",type:"stream",url:"https://atimevideo.smartclick.co.th/live/efmlive.sdp/chunklist.m3u8"},
  {name:"BANGKOK.FM",freq:"Online",quality:"OFFICIAL WEB",type:"external",url:"https://bangkok.fm/"}
];

let currentIndex = Number(localStorage.getItem("bkkAirwavesLast") || 0);
let sleepTimer = null;
let sleepCountdown = null;
let sleepEndAt = null;
let analyser = null, audioCtx = null, sourceNode = null, analyserReady = false;
let raf = null;

const player = document.getElementById("player");
const centerBtn = document.getElementById("centerBtn");
const heroName = document.getElementById("heroName");
const heroFreq = document.getElementById("heroFreq");
const heroQuality = document.getElementById("heroQuality");
const statusMain = document.getElementById("statusMain");
const statusSub = document.getElementById("statusSub");
const grid = document.getElementById("stationGrid");
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

function setCenterIcon(isPlaying){
  centerBtn.innerHTML = isPlaying
    ? '<span class="pauseIcon"></span>'
    : '<span class="playIcon"></span>';
}

function renderStations(){
  grid.innerHTML="";
  stations.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="stbtn"+(i===currentIndex?" active":"");
    b.innerHTML=`<div class="n">${s.name}</div><div class="f">${s.freq}</div>`;
    b.onclick=()=>selectStation(i,true);
    grid.appendChild(b);
  });
}
function updateHero(){
  const s=stations[currentIndex];
  heroName.textContent=s.name;
  heroFreq.textContent=s.freq;
  heroQuality.textContent=s.quality;
  renderStations();
}
async function selectStation(i,autoplay=false){
  currentIndex=(i+stations.length)%stations.length;
  localStorage.setItem("bkkAirwavesLast",currentIndex);
  const s=stations[currentIndex];
  updateHero();

  if(s.type==="external"){
    player.pause();setCenterIcon(false);
    statusMain.innerHTML="<b>Official page</b>";
    statusSub.textContent=s.name;
    if(autoplay) window.open(s.url,"_blank");
    return;
  }

  if(player.dataset.url!==s.url){
    player.pause();
    player.src=s.url;
    player.dataset.url=s.url;
    player.load();
    analyserReady=false;
  }
  if(autoplay) await startPlayback();
}
async function startPlayback(){
  const s=stations[currentIndex];
  if(s.type==="external"){window.open(s.url,"_blank");return}
  statusMain.innerHTML="<b>Connecting…</b>";statusSub.textContent=s.name;
  try{
    await player.play();
    setCenterIcon(true);
    statusMain.innerHTML="<b>Live now</b>";
    statusSub.textContent=s.freq;
    tryEnableRealVisualizer();
  }catch(e){
    setCenterIcon(false);
    statusMain.innerHTML="<b>Unavailable</b>";
    statusSub.textContent="Try again";
  }
  renderStations();
}
function togglePlay(){
  const s=stations[currentIndex];
  if(s.type==="external"){window.open(s.url,"_blank");return}
  if(player.paused) startPlayback();
  else{
    player.pause();setCenterIcon(false);
    statusMain.innerHTML="<b>Paused</b>";statusSub.textContent=s.freq;renderStations();
  }
}
function nextStation(){selectStation(currentIndex+1,true)}
function prevStation(){selectStation(currentIndex-1,true)}
function showStationMenu(){grid.scrollTo({top:0,behavior:"smooth"})}
function setSleep(m, btn){
  clearTimeout(sleepTimer);
  clearInterval(sleepCountdown);

  document.querySelectorAll(".sleep button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");

  sleepEndAt = Date.now() + m * 60000;

  const updateSleepCountdown = ()=>{
    const remainingMs = Math.max(0, sleepEndAt - Date.now());
    const remainingMin = Math.ceil(remainingMs / 60000);

    if(remainingMs <= 0){
      clearInterval(sleepCountdown);
      statusMain.innerHTML="<b>Sleep ended</b>";
      statusSub.textContent="Playback stopped";
      document.querySelectorAll(".sleep button").forEach(b=>b.classList.remove("active"));
      return;
    }

    statusMain.innerHTML=`<b>Sleep · ${remainingMin} min${remainingMin===1?"":"s"} left</b>`;
    statusSub.textContent="Countdown active";
  };

  updateSleepCountdown();
  sleepCountdown = setInterval(updateSleepCountdown, 1000);

  sleepTimer=setTimeout(()=>{
    player.pause();
    setCenterIcon(false);
    clearInterval(sleepCountdown);
    statusMain.innerHTML="<b>Sleep ended</b>";
    statusSub.textContent="Playback stopped";
    document.querySelectorAll(".sleep button").forEach(b=>b.classList.remove("active"));
  },m*60000);
}
player.addEventListener("playing",()=>{setCenterIcon(true);renderStations()});
player.addEventListener("pause",()=>renderStations());
player.addEventListener("waiting",()=>statusMain.innerHTML="<b>Buffering…</b>");
player.addEventListener("error",()=>{setCenterIcon(false);statusMain.innerHTML="<b>Stream error</b>";statusSub.textContent="Source unavailable"});

/* REAL audio-reactive canvas when the stream permits Web Audio/CORS.
   If a broadcaster blocks analyser access, it falls back to a calm idle display
   without interfering with audio playback. */
async function tryEnableRealVisualizer(){
  // Disabled for direct radio streams.
  // Chrome can mute cross-origin media when routed through Web Audio
  // unless every stream is served with compatible CORS headers.
  analyserReady = false;
}
function drawVisualizer(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#123a60");grad.addColorStop(1,"#081c31");
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);

  const bars=18,gap=5,bw=(w-34-(bars-1)*gap)/bars;
  let vals=[];
  if(analyserReady && analyser){
    const data=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    for(let i=0;i<bars;i++){
      const idx=Math.floor(i*data.length/bars);
      vals.push(Math.max(6,data[idx]/255*(h*.72)));
    }
  }else{
    const t=performance.now()/650;
    for(let i=0;i<bars;i++){
      vals.push(16+(Math.sin(t+i*.55)+1)*10);
    }
  }
  for(let i=0;i<bars;i++){
    const x=17+i*(bw+gap), bh=vals[i], y=h-bh-22;
    const g=ctx.createLinearGradient(0,y,0,h-20);
    g.addColorStop(0,"rgba(210,240,255,.95)");
    g.addColorStop(1,"rgba(90,180,255,.42)");
    ctx.fillStyle=g;
    roundRect(ctx,x,y,bw,bh,Math.min(8,bw/2));
    ctx.fill();
  }
  ctx.fillStyle="rgba(255,255,255,.62)";
  ctx.font="600 18px -apple-system, sans-serif";
  ctx.fillText(analyserReady?"AUDIO REACTIVE":"LIVE VISUAL",18,28);
  raf=requestAnimationFrame(drawVisualizer);
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.roundRect(x,y,w,h,r);
}
updateHero();renderStations();setCenterIcon(false);drawVisualizer();
</script>
</body>
</html>
