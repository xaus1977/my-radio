<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#67758d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BKK Airwaves">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BKK Airwaves — iPod Fit</title>
<style>
:root{
  --body1:#78869e; --body2:#5e6a80; --screen1:#163a5f; --screen2:#0c223b;
  --white:#f7f9fc; --muted:#bbcae0; --wheel:#191e27; --wheel2:#282f3d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151d;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100dvh}
.app{
  width:100vw;height:100dvh;
  padding:max(env(safe-area-inset-top),28px) 10px max(env(safe-area-inset-bottom),8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg,#121722,#0d1118);
}
.ipod{
  position:relative;
  overflow:visible;
  width:min(94vw,470px);
  height:min(calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 46px),900px);
  min-height:620px;
  border-radius:clamp(28px,7vw,50px);
  padding:clamp(12px,3.6vw,22px);
  display:grid;
  grid-template-rows:minmax(340px,49%) 1fr auto;
  gap:clamp(10px,2.2vh,18px);
  background:linear-gradient(180deg,var(--body1),var(--body2));
  box-shadow:0 24px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.26);
}
.screen-frame{
  position:relative;min-height:0;background:#111720;border-radius:26px;padding:8px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)
}
.screenOffOverlay{
  position:absolute;inset:8px;border-radius:19px;background:#010203;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
  z-index:20;box-shadow:inset 0 0 36px rgba(0,0,0,.98)
}
.ipod.poweredOff .screenOffOverlay{opacity:1}
.ipod.booting .screen{opacity:0}
.ipod.waking .screen{opacity:0}
.deviceBtn{
  position:absolute;border:0;
  background:linear-gradient(180deg,#7c899d 0%,#667387 48%,#596579 52%,#6a7689 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.24),
    inset 0 -1px 0 rgba(0,0,0,.28),
    0 1px 2px rgba(0,0,0,.34);
  z-index:30;color:rgba(238,243,249,.82)
}
.powerBtn{
  top:-4px;right:62px;width:58px;height:9px;border-radius:7px 7px 4px 4px;
  display:flex;align-items:center;justify-content:center;
  border-left:1px solid rgba(0,0,0,.2);border-right:1px solid rgba(255,255,255,.12)
}
.powerGlyph{
  width:20px;height:2px;border-radius:2px;
  background:rgba(28,34,44,.45);
  box-shadow:0 1px 0 rgba(255,255,255,.12)
}
.powerGlyph:before{display:none}
.volRail{
  position:absolute;left:-5px;top:36%;display:flex;flex-direction:column;gap:8px;z-index:30
}
.volBtn{
  position:relative;width:10px;height:45px;border-radius:5px 2px 2px 5px;padding:0;
  border-left:1px solid rgba(0,0,0,.22)
}
.volBtn span,.volBtn span:before{
  content:"";position:absolute;left:55%;top:50%;transform:translate(-50%,-50%);
  width:5px;height:1px;background:rgba(238,243,249,.62);border-radius:2px
}
.volBtn.plus span:before{transform:translate(-50%,-50%) rotate(90deg)}
.deviceBtn:active{filter:brightness(.86)}
.powerBtn:active{transform:translateY(1px)}
.volBtn:active{transform:translateX(1px)}

.volumeHUD{
  display:inline-flex;align-items:center;gap:3px;margin-left:auto;margin-right:8px;
  opacity:.62;transition:opacity .18s ease
}
.volumeHUD.show{opacity:1}
.volMiniIcon{
  position:relative;width:8px;height:8px
}
.volMiniIcon:before{
  content:"";position:absolute;left:0;top:3px;width:3px;height:3px;background:#dce7f5;border-radius:1px
}
.volMiniIcon:after{
  content:"";position:absolute;left:3px;top:1px;
  border-top:3px solid transparent;border-bottom:3px solid transparent;border-right:4px solid #dce7f5
}
.volBars{display:flex;align-items:flex-end;gap:1.5px;height:8px}
.volBars i{
  display:block;width:2px;border-radius:1px;background:rgba(220,231,245,.28)
}
.volBars i:nth-child(1){height:2px}.volBars i:nth-child(2){height:3px}.volBars i:nth-child(3){height:4px}
.volBars i:nth-child(4){height:5px}.volBars i:nth-child(5){height:6px}.volBars i:nth-child(6){height:7px}
.volBars i.on{background:#eef5ff}

.bootOverlay{
  position:absolute;inset:8px;border-radius:19px;z-index:24;
  background:
    radial-gradient(circle at 50% 42%,rgba(31,68,105,.34),transparent 38%),
    linear-gradient(180deg,#07111c,#020508);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#d8e4f4;opacity:0;pointer-events:none;transition:opacity .18s ease
}
.ipod.booting .bootOverlay{opacity:1;pointer-events:all;transition:none}
.bootLogo{
  font-size:15px;font-weight:760;letter-spacing:.18em;text-transform:uppercase;
  text-shadow:0 0 12px rgba(160,205,255,.18)
}
.bootSub{
  margin-top:7px;font-size:8px;letter-spacing:.24em;color:#7187a2
}
.bootTicks{display:flex;gap:4px;margin-top:18px}
.bootTicks i{
  width:4px;height:13px;border-radius:2px;background:rgba(151,183,220,.16);
  animation:bootTick 1.05s ease-in-out infinite
}
.bootTicks i:nth-child(2){animation-delay:.09s}.bootTicks i:nth-child(3){animation-delay:.18s}
.bootTicks i:nth-child(4){animation-delay:.27s}.bootTicks i:nth-child(5){animation-delay:.36s}
.bootTicks i:nth-child(6){animation-delay:.45s}.bootTicks i:nth-child(7){animation-delay:.54s}
@keyframes bootTick{
  0%,100%{background:rgba(151,183,220,.14);transform:scaleY(.6)}
  45%{background:#dbeaff;transform:scaleY(1)}
}

.shutdownOverlay{
  position:absolute;inset:8px;border-radius:19px;z-index:28;
  background:#000;opacity:0;pointer-events:none;overflow:hidden;
}
.shutdownOverlay:before{
  content:"";position:absolute;left:50%;top:50%;
  width:86%;height:2px;transform:translate(-50%,-50%) scaleX(0);
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#8fc6ff 18%,#fff 50%,#8fc6ff 82%,transparent);
  box-shadow:0 0 8px rgba(185,222,255,.95),0 0 22px rgba(100,180,255,.45);
}
.shutdownOverlay:after{
  content:"";position:absolute;left:50%;top:50%;
  width:6px;height:6px;transform:translate(-50%,-50%) scale(0);
  border-radius:50%;background:#fff;
  box-shadow:0 0 12px rgba(205,235,255,.95),0 0 28px rgba(92,168,255,.65);
}
.ipod.poweringDown .shutdownOverlay{
  opacity:1;animation:crtBlack .72s steps(1,end) forwards
}
.ipod.poweringDown .shutdownOverlay:before{
  animation:crtLine .72s cubic-bezier(.2,.8,.2,1) forwards
}
.ipod.poweringDown .shutdownOverlay:after{
  animation:crtDot .72s ease-out forwards
}
.ipod.poweringDown .screen{
  animation:crtScreenCollapse .72s cubic-bezier(.2,.75,.25,1) forwards
}
@keyframes crtScreenCollapse{
  0%{transform:scale(1,1);filter:brightness(1)}
  35%{transform:scale(1,.72);filter:brightness(1.35)}
  68%{transform:scale(.96,.025);filter:brightness(2.1)}
  100%{transform:scale(0,0);filter:brightness(2.5)}
}
@keyframes crtLine{
  0%,42%{transform:translate(-50%,-50%) scaleX(0)}
  52%{transform:translate(-50%,-50%) scaleX(1)}
  79%{transform:translate(-50%,-50%) scaleX(.22)}
  100%{transform:translate(-50%,-50%) scaleX(0)}
}
@keyframes crtDot{
  0%,72%{transform:translate(-50%,-50%) scale(0)}
  82%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-50%) scale(0)}
}
@keyframes crtBlack{
  0%,97%{opacity:1}
  100%{opacity:0}
}

.releaseNote{
  width:min(92vw,470px);
  min-height:24px;
  padding:0 8px;
  text-align:center;
  color:rgba(206,216,230,.48);
  font-size:8px;line-height:1.35;letter-spacing:.035em;
  user-select:none;
}
.releaseNote b{color:rgba(225,233,243,.64);font-weight:650}

.screen{
  height:100%;min-height:0;border-radius:19px;padding:12px;color:var(--white);overflow:hidden;
  opacity:1;transition:opacity 2s ease;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.13),transparent 26%),
    linear-gradient(180deg,var(--screen1),var(--screen2));
  display:grid;grid-template-rows:auto auto auto 1fr;
  gap:8px;
}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#dce7f5}
.nowrow{display:grid;grid-template-columns:42% 1fr;gap:12px;min-height:0}
.visual{
  width:100%;aspect-ratio:1/1;border-radius:12px;cursor:pointer;
  background:linear-gradient(180deg,#0a1b30,#0d3558);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.info{min-width:0;display:flex;flex-direction:column;justify-content:center}
.label{font-size:11px;color:#dce7f5;margin-bottom:3px}
.station{
  font-size:clamp(20px,6vw,31px);line-height:1.0;font-weight:800;letter-spacing:-.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer
}
.station span{display:inline-block;white-space:nowrap;will-change:transform}
.station.marquee span{
  padding-right:34px;
  animation:stationMarquee 9s linear infinite;
}
@keyframes stationMarquee{
  0%{transform:translateX(0)}
  100%{transform:translateX(calc(-100% - 34px))}
}
.freq{font-size:14px;color:var(--muted);margin-top:6px}
.quality{font-size:10px;color:#9fb3ce;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visualHint{font-size:9px;color:#89a4c5;margin-top:5px;opacity:.9}
.livebar{height:6px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
.liveProgress{height:100%;width:0%;background:#f5f8fc;border-radius:999px;transition:width .25s linear}
.status{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#b8c9df}
.status b{color:#fff;font-weight:650}
.picker{
  min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;
  scrollbar-width:none;
}
.picker::-webkit-scrollbar{display:none}
.stbtn{
  appearance:none;border:1px solid rgba(255,255,255,.11);border-radius:10px;
  background:rgba(255,255,255,.055);color:#f1f5fb;padding:7px 8px;text-align:left;min-height:42px
}
.stbtn.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25)}
.stbtn .n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbtn .f{font-size:9px;color:#b8c9dd;margin-top:2px}
.wheel-area{display:flex;align-items:center;justify-content:center;min-height:0}
.wheel{
  width:min(64vw,335px,33vh);height:min(64vw,335px,33vh);
  min-width:220px;min-height:220px;
  position:relative;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,var(--wheel2),var(--wheel));
  box-shadow:inset 0 2px 2px rgba(255,255,255,.04),inset 0 -10px 18px rgba(0,0,0,.28),0 10px 18px rgba(25,32,43,.2)
}
.center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:39%;height:39%;border:0;border-radius:50%;color:#fff;
  background:radial-gradient(circle at 40% 35%,#2c3544,#171d27);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.05),inset 0 -10px 16px rgba(0,0,0,.28);
  display:grid;place-items:center
}
.playIcon{
  width:0;height:0;
  border-top:18px solid transparent;
  border-bottom:18px solid transparent;
  border-left:28px solid #fff;
  margin-left:7px;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.14))
}
.pauseIcon{
  width:34px;height:38px;
  display:flex;align-items:center;justify-content:space-between;
}
.pauseIcon::before,.pauseIcon::after{
  content:"";display:block;width:12px;height:38px;border-radius:5px;background:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.12)
}
.wbtn{position:absolute;border:0;background:transparent;color:#f5f7fb;font-weight:650}
.menu{left:50%;top:8%;transform:translateX(-50%);font-size:12px;letter-spacing:.08em}
.prev{left:8%;top:50%;transform:translateY(-50%);font-size:28px}
.next{right:8%;top:50%;transform:translateY(-50%);font-size:28px}
.pp{left:50%;bottom:6%;transform:translateX(-50%);width:54px;height:40px}
.transportBtn{display:flex;align-items:center;justify-content:center}
.transportCombo{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:40px;height:24px;
}
.comboPlay{
  width:0;height:0;
  border-top:10px solid transparent;
  border-bottom:10px solid transparent;
  border-left:16px solid #f5f7fb;
}
.comboPause{
  display:flex;align-items:center;gap:4px;height:20px;
}
.comboPause i{
  display:block;width:5px;height:20px;border-radius:1.5px;background:#f5f7fb;
}
.skipIcon{width:54px;height:48px;position:absolute}
.skipIcon .skipBar{position:absolute;top:12px;left:7px;width:6px;height:24px;border-radius:2px;background:#f5f7fb}
.skipIcon .skipBar.rightBar{left:auto;right:7px}
.skipIcon .skipTri{position:absolute;top:12px;width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent}
.skipIcon .skipTri.left{border-right:16px solid #f5f7fb}
.skipIcon .skipTri.left.one{left:14px}
.skipIcon .skipTri.left.two{left:28px}
.skipIcon .skipTri.right{border-left:16px solid #f5f7fb}
.skipIcon .skipTri.right.one{right:14px}
.skipIcon .skipTri.right.two{right:28px}
.bottom{
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  color:#edf2f8;font-size:10px;padding:0 4px
}
.sleepwrap{display:flex;flex-direction:column;gap:5px}
.sleeplabel{
  font-size:9px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.74);
  padding-left:2px
}
.sleep{display:flex;gap:6px}
.sleep button{
  border:0;border-radius:999px;padding:7px 10px;
  background:rgba(255,255,255,.16);color:#fff;font-size:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.12);
  transition:transform .08s ease, box-shadow .08s ease, background .08s ease
}
.sleep button:active{
  transform:translateY(1px) scale(.97);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.36);
}
.sleep button.active{
  background:rgba(255,255,255,.30);
  transform:translateY(1px) scale(.97);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.16)
}
.hardware{opacity:.78;text-align:right}
@media (max-height:720px){
  .ipod{grid-template-rows:minmax(300px,49%) 1fr auto;gap:8px}
  .screen{padding:10px;gap:6px}
  .picker{grid-template-columns:repeat(3,1fr)}
  .stbtn{min-height:36px;padding:5px 6px}
  .stbtn .n{font-size:10px}.stbtn .f{font-size:8px}
}

/* ===== BKK Airwaves Desktop 0.1 ===== */
html,body{background:transparent!important}
body{-webkit-user-select:none;user-select:none}
/* Only clearly non-interactive areas are draggable.
   Do not make the root .app or the whole .ipod draggable, because Electron
   draggable regions can swallow click events from floating window controls. */
.screen-frame,.screen,.wheel-area,.wheel,.bottom,.releaseNote,
.top,.nowrow,.info,.status,.livebar,.picker{
  -webkit-app-region:drag
}
button,.deviceBtn,.volRail,.stbtn,.visual,.station,.sleep,
.stationPager,.stationPager *,
.desktopControls,.desktopControls *{
  -webkit-app-region:no-drag!important
}
.desktopControls{
  position:fixed;top:7px;right:9px;z-index:9999;
  display:flex;gap:5px;opacity:.24;transition:opacity .18s ease;
  -webkit-app-region:no-drag
}
.desktopControls:hover{opacity:.9}
.desktopControls button{
  width:24px;height:20px;border:0;border-radius:7px;
  background:rgba(255,255,255,.08);color:rgba(238,244,252,.85);
  font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  cursor:default
}
.desktopControls button:hover{background:rgba(255,255,255,.16)}
.desktopControls .pin.active{background:rgba(210,229,255,.18);color:#fff}
.releaseNote{
  max-width:470px;
}
@media (max-height:760px){
  .releaseNote{display:none}
}



.resizeGrip:before{width:14px;height:14px}
.resizeGrip:after{width:8px;height:8px;right:4px;bottom:4px}


/* Desktop skin mode: only the iPod itself is visible. */
body{background:transparent!important}
.app{background:transparent!important}

/* Keep the body just large enough to host the skin. */
.ipod{
  width:min(92vw,560px);
  height:min(calc(100dvh - 46px),1020px);
}

/* Desktop size controls. */
.desktopSizeControls{
  display:flex;gap:3px;
  -webkit-app-region:no-drag
}
.desktopSizeControls button{
  width:22px!important;
}


.desktopControls{
  top:12px!important;
  right:14px!important;
  transform:translateY(-100%);
  opacity:.32!important;
  gap:6px!important;
}
.desktopControls:hover{opacity:1!important}
.desktopControls button{
  transition:background .14s ease,box-shadow .14s ease,color .14s ease,transform .12s ease!important;
  border:1px solid rgba(255,255,255,.06)!important;
}
.desktopControls button:hover,
.desktopControls button:focus-visible{
  background:rgba(230,240,255,.22)!important;
  color:#fff!important;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.12),
    0 0 14px rgba(168,204,255,.28),
    inset 0 1px 0 rgba(255,255,255,.15)!important;
  outline:none!important;
}
.desktopControls button:active{
  transform:translateY(1px)!important;
  background:rgba(230,240,255,.16)!important;
}
.desktopControls .pin.active{
  background:rgba(178,214,255,.25)!important;
  color:#fff!important;
  box-shadow:
    0 0 0 1px rgba(179,211,255,.2),
    0 0 12px rgba(160,203,255,.24),
    inset 0 1px 0 rgba(255,255,255,.15)!important;
}
.desktopControls .pin:not(.active){
  background:rgba(255,255,255,.055)!important;
  color:rgba(238,244,252,.55)!important;
}


/* Desktop 0.5: preserve one logical layout at every window size. */
.app{
  width:100vw!important;
  height:100dvh!important;
  padding:34px 10px 8px!important;
  box-sizing:border-box!important;
}
.ipod{
  width:min(94vw,470px)!important;
  height:min(calc(100dvh - 52px),900px)!important;
  min-height:620px!important;
}
.desktopControls{
  top:7px!important;
  right:12px!important;
  transform:none!important;
  opacity:.38!important;
  z-index:10000!important;
}
.desktopControls:hover{opacity:1!important}

/* Make the top controls look unmistakably interactive on hover. */
.desktopControls button:hover,
.desktopControls button:focus-visible{
  background:rgba(235,244,255,.30)!important;
  color:#fff!important;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.18),
    0 0 18px rgba(170,210,255,.42),
    inset 0 1px 0 rgba(255,255,255,.18)!important;
}

/* Ensure the whole non-interactive skin can be used as a drag handle. */
.screen-frame,.screen,.wheel-area,.wheel,.bottom,.top,.nowrow,.info,.status,.livebar,.picker{
  -webkit-app-region:drag!important;
}
button,.deviceBtn,.volRail,.stbtn,.visual,.station,.sleep,
.desktopControls,.desktopControls *{
  -webkit-app-region:no-drag!important;
}


/* Desktop 0.5.2 click hardening */
.desktopControls{
  pointer-events:auto!important;
  -webkit-app-region:no-drag!important;
  z-index:2147483647!important;
  position:fixed!important;
  top:7px!important;
  right:10px!important;
}
.desktopControls *,
.desktopControls button,
.desktopSizeControls,
.desktopSizeControls *{
  pointer-events:auto!important;
  -webkit-app-region:no-drag!important;
}
.desktopControls button{
  cursor:pointer!important;
}

/* The thin empty strip at the very top can drag the window.
   Controls sit above it and remain no-drag/clickable. */
.desktopDragStrip{
  position:fixed;left:0;right:0;top:0;height:32px;z-index:9990;
  -webkit-app-region:drag;pointer-events:auto;
}


/* Desktop 0.6.1 — stable native dragging.
   No JavaScript pointer-drag: this avoids window jumping.
   Drag from the top strip, bezel/background, wheel background, status areas and footer.
   Interactive controls remain clickable. */
.desktopDragStrip,
.screen-frame,.screen,.wheel-area,.wheel,.bottom,.releaseNote,
.top,.nowrow,.info,.status,.livebar,.picker{
  -webkit-app-region:drag!important;
}
button,.deviceBtn,.volRail,.stbtn,.visual,.station,.sleep,
.desktopControls,.desktopControls *{
  -webkit-app-region:no-drag!important;
}

/* Crisp small text without making the UI heavier.
   Use normal/medium weights, slightly stronger contrast, and cleaner tracking. */
body{
  text-rendering:optimizeLegibility;

  // that this line is a live song title, even when the text is short.
  const probe=document.createElement("span");
  probe.style.cssText="position:absolute;visibility:hidden;white-space:nowrap;";
  probe.textContent=title;
  heroQuality.appendChild(probe);
  const titleWidth=probe.scrollWidth;
  probe.remove();

  // Two identical copies create a continuous seamless conveyor loop.
  const track=document.createElement("span");
  track.className="songTrack";

  const a=document.createElement("span");
  a.className="songCopy";
  a.textContent=title;

  const b=document.createElement("span");
  b.className="songCopy";
  b.textContent=title;

  track.append(a,b);
  heroQuality.appendChild(track);
  heroQuality.classList.add("songMarquee");

  // Keep a calm, nearly constant speed. Short titles still get enough
  // travel time to avoid looking like a ticker or flashing notification.
  const pxPerSecond=24;
  const travel=Math.max(titleWidth, heroQuality.clientWidth) + 42;
  const duration=Math.max(12,Math.min(26,travel/pxPerSecond));
  heroQuality.style.setProperty("--song-marquee-duration",`${duration.toFixed(2)}s`);
}

function isHlsStream(url){
  return /\.m3u8(?:$|\?)/i.test(url||"");
}

function destroyHlsEngine(){
  if(hlsEngine){
    try{ hlsEngine.destroy(); }catch(_){}
    hlsEngine=null;
  }
  hlsReadyPromise=null;
}

function prepareStreamSource(url){
  // MP3/AAC/direct streams keep the original direct player path.
  if(!isHlsStream(url)){
    destroyHlsEngine();
    if(player.dataset.url!==url){
      player.pause();
      player.src=url;
      player.dataset.url=url;
      player.load();
      analyserReady=false;
    }
    return Promise.resolve();
  }

  // HLS on Electron/Windows is handled by hls.js over MediaSource.
  if(window.Hls && Hls.isSupported()){
    destroyHlsEngine();
    player.pause();
    player.removeAttribute("src");
    player.load();
    player.dataset.url=url;

    hlsEngine=new Hls({
      enableWorker:true,
      lowLatencyMode:false,
      backBufferLength:30
    });

    hlsReadyPromise=new Promise((resolve,reject)=>{
      let settled=false;
      const ok=()=>{ if(!settled){settled=true;resolve();} };
      const bad=(err)=>{ if(!settled){settled=true;reject(err||new Error("HLS unavailable"));} };

      hlsEngine.on(Hls.Events.MEDIA_ATTACHED,()=>{
        try{ hlsEngine.loadSource(url); }catch(e){ bad(e); }
      });
      hlsEngine.on(Hls.Events.MANIFEST_PARSED,ok);
      hlsEngine.on(Hls.Events.ERROR,(_event,data)=>{
        if(data?.fatal) bad(new Error(data.type||"HLS fatal error"));
      });
      try{ hlsEngine.attachMedia(player); }catch(e){ bad(e); }
      setTimeout(()=>bad(new Error("HLS manifest timeout")),10000);
    });

    analyserReady=false;
    return hlsReadyPromise;
  }

  // Native-HLS fallback for environments that support it.
  destroyHlsEngine();
  if(player.dataset.url!==url){
    player.pause();
    player.src=url;
    player.dataset.url=url;
    player.load();
    analyserReady=false;
  }
  return Promise.resolve();
}

let pageTransitionBusy=false;
function changeStationPage(step){
  const groups=stationGroups();
  if(groups.length<2 || pageTransitionBusy) return;

  let index=groups.indexOf(currentPage);
  if(index<0) index=0;
  const next=(index+step+groups.length)%groups.length;
  if(next===index) return;

  pageTransitionBusy=true;
  const outX=step>0 ? -24 : 24;
  const inX=-outX;

  const finish=()=>{
    currentPage=groups[next];
    localStorage.setItem("bkkAirwavesPage",currentPage);
    renderStations();
    renderPageDots();

    if(grid?.animate){
      grid.animate(
        [{transform:`translateX(${inX}px)`,opacity:.35},{transform:"translateX(0)",opacity:1}],
        {duration:150,easing:"cubic-bezier(.22,.61,.36,1)"}
      ).finished.finally(()=>{ pageTransitionBusy=false; });
    }else{
      pageTransitionBusy=false;
    }
  };

  if(grid?.animate){
    grid.animate(
      [{transform:"translateX(0)",opacity:1},{transform:`translateX(${outX}px)`,opacity:.35}],
      {duration:105,easing:"ease-in"}
    ).finished.then(finish).catch(finish);
  }else{
    finish();
  }
}

let swipeStartX=0;
let swipeStartY=0;
let swipeStartTime=0;
let swipeConsumed=false;

const swipeSurface=document.querySelector(".screen");
swipeSurface?.addEventListener("touchstart",(e)=>{
  const t=e.changedTouches?.[0];
  if(!t) return;
  swipeStartX=t.clientX;
  swipeStartY=t.clientY;
  swipeStartTime=Date.now();
  swipeConsumed=false;
},{passive:true});

swipeSurface?.addEventListener("touchend",(e)=>{
  const t=e.changedTouches?.[0];
  if(!t) return;
  const dx=t.clientX-swipeStartX;
  const dy=t.clientY-swipeStartY;
  const elapsed=Date.now()-swipeStartTime;

  if(elapsed<700 && Math.abs(dx)>=46 && Math.abs(dx)>Math.abs(dy)*1.25){
    swipeConsumed=true;
    changeStationPage(dx<0 ? 1 : -1);
  }
},{passive:true});

// Prevent a station button from firing after the same gesture was used as a swipe.
swipeSurface?.addEventListener("click",(e)=>{
  if(!swipeConsumed) return;
  swipeConsumed=false;
  e.preventDefault();
  e.stopPropagation();
},{capture:true});

// Desktop mouse: click selects stations; only a deliberate horizontal drag swipes pages.
let mouseSwipeStartX=0;
let mouseSwipeStartY=0;
let mouseSwipeActive=false;
let mouseSwipeDidNavigate=false;

stationPager?.addEventListener("pointerdown",(e)=>{
  if(e.pointerType!=="mouse" || e.button!==0) return;
  mouseSwipeActive=true;
  mouseSwipeDidNavigate=false;
  mouseSwipeStartX=e.clientX;
  mouseSwipeStartY=e.clientY;
});

document.addEventListener("pointermove",(e)=>{
  if(!mouseSwipeActive || e.pointerType!=="mouse") return;
  const dx=e.clientX-mouseSwipeStartX;
  const dy=e.clientY-mouseSwipeStartY;

  if(Math.abs(dx)>=12 && Math.abs(dx)>Math.abs(dy)*1.15){
    stationPager?.classList.add("mouseSwiping");
  }
});

document.addEventListener("pointerup",(e)=>{
  if(!mouseSwipeActive || e.pointerType!=="mouse") return;

  const dx=e.clientX-mouseSwipeStartX;
  const dy=e.clientY-mouseSwipeStartY;
  mouseSwipeActive=false;
  stationPager?.classList.remove("mouseSwiping");

  if(Math.abs(dx)>=52 && Math.abs(dx)>Math.abs(dy)*1.35){
    mouseSwipeDidNavigate=true;
    changeStationPage(dx<0 ? 1 : -1);
  }
});

document.addEventListener("pointercancel",()=>{
  mouseSwipeActive=false;
  mouseSwipeDidNavigate=false;
  stationPager?.classList.remove("mouseSwiping");
});

// Suppress only the click generated by a real drag.
// Normal clicks always reach the station buttons.
stationPager?.addEventListener("click",(e)=>{
  if(!mouseSwipeDidNavigate) return;
  mouseSwipeDidNavigate=false;
  e.preventDefault();
  e.stopPropagation();
},{capture:true});


function formatStationTime(ms){
  const totalSeconds=Math.floor(ms/1000);
  const m=Math.floor(totalSeconds/60);
  const s=totalSeconds%60;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function currentStationElapsed(){
  return stationElapsedMs + (stationPlayStartedAt!==null ? Date.now()-stationPlayStartedAt : 0);
}
function paintStationTimer(){
  const elapsed=currentStationElapsed();
  const loopMs=300000; // 5 minutes
  const withinLoop=elapsed%loopMs;
  liveProgress.style.width=((withinLoop/loopMs)*100)+"%";
  statusSub.textContent=formatStationTime(elapsed);
  stationTimerRAF=requestAnimationFrame(paintStationTimer);
}
function resetStationTimer(){
  stationElapsedMs=0;
  stationPlayStartedAt=null;
  liveProgress.style.width="0%";
  statusSub.textContent="0:00";
}
function startStationTimer(){
  if(stationPlayStartedAt===null) stationPlayStartedAt=Date.now();
  if(stationTimerRAF===null){
    const loop=()=>{
      stationTimerRAF=requestAnimationFrame(loop);
      const elapsed=currentStationElapsed();
      const loopMs=300000;
      const withinLoop=elapsed%loopMs;
      // show full bar exactly at each 5-minute boundary before cycling.
      let pct=(withinLoop/loopMs)*100;
      if(elapsed>0 && withinLoop<250) pct=100;
      liveProgress.style.width=pct+"%";
      statusSub.textContent=formatStationTime(elapsed);
    };
    loop();
  }
}
function pauseStationTimer(){
  if(stationPlayStartedAt!==null){
    stationElapsedMs += Date.now()-stationPlayStartedAt;
    stationPlayStartedAt=null;
  }
  if(stationTimerRAF!==null){
    cancelAnimationFrame(stationTimerRAF);
    stationTimerRAF=null;
  }
  const elapsed=currentStationElapsed();
  const withinLoop=elapsed%300000;
  liveProgress.style.width=((withinLoop/300000)*100)+"%";
  statusSub.textContent=formatStationTime(elapsed);
}

function powerOffDevice(rememberPlayback=true){
  if(!poweredOn || bootTimer) return;

  poweredOn=false;
  resumeAfterPowerOn=rememberPlayback ? !player.paused : false;

  cancelSleepForPower();
  player.pause();
  pauseStationTimer();
  setCenterIcon(false);

  ipodShell.classList.remove("booting","waking","poweredOff");
  ipodShell.classList.add("poweringDown");

  setTimeout(()=>{
    ipodShell.classList.remove("poweringDown");
    ipodShell.classList.add("poweredOff");
  },720);
}

function powerOnDevice(){
  if(poweredOn || bootTimer) return;

  poweredOn=true;

  // Keep the dark screen underneath and show boot immediately.
  ipodShell.classList.remove("poweringDown");
  ipodShell.classList.add("booting");
  statusMain.innerHTML="<b>Starting…</b>";

  bootTimer=setTimeout(()=>{
    ipodShell.classList.add("waking");
    ipodShell.classList.remove("poweredOff","booting");
    bootTimer=null;

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        ipodShell.classList.remove("waking");
      });
    });

    setTimeout(()=>{
      if(resumeAfterPowerOn && stations[currentIndex] && stations[currentIndex].type==="stream"){
        startPlayback();
      }else{
        statusMain.innerHTML="<b>Ready</b>";
      }
      resumeAfterPowerOn=false;
    },250);
  },4000);
}

function togglePower(){
  if(bootTimer) return;
  if(poweredOn) powerOffDevice(true);
  else powerOnDevice();
}

function adjustAppVolume(delta){
  if(!poweredOn) return;

  const target=Math.max(0,Math.min(1,appVolume+delta));
  const oldVolume=player.volume;

  try{
    player.volume=target;
    // Some mobile Safari versions ignore programmatic media volume.
    if(Math.abs(player.volume-target)<0.01){
      appVolume=target;
      localStorage.setItem("bkkAirwavesVolume",String(appVolume));
      updateVolumeHUD();
      flashVolumeHUD();
      const old=statusMain.innerHTML;
      statusMain.innerHTML=`<b>Volume ${Math.round(appVolume*100)}%</b>`;
      setTimeout(()=>{
        if(statusMain.textContent.startsWith("Volume")) statusMain.innerHTML=old;
      },700);
    }else{
      const old=statusMain.innerHTML;
      flashVolumeHUD();
      statusMain.innerHTML="<b>Use device volume</b>";
      setTimeout(()=>{
        if(statusMain.textContent==="Use device volume") statusMain.innerHTML=old;
      },900);
      player.volume=oldVolume;
    }
  }catch(e){
    const old=statusMain.innerHTML;
    flashVolumeHUD();
    statusMain.innerHTML="<b>Use device volume</b>";
    setTimeout(()=>{
      if(statusMain.textContent==="Use device volume") statusMain.innerHTML=old;
    },900);
  }
}

async function selectStation(i,autoplay=false){
  const previousIndex=currentIndex;
  currentIndex=(i+stations.length)%stations.length;
  currentPage=stations[currentIndex].group||currentPage;
  localStorage.setItem("bkkAirwavesLast",currentIndex);
  localStorage.setItem("bkkAirwavesPage",currentPage);
  updatePageToggle();
  const s=stations[currentIndex];
  if(currentIndex!==previousIndex) resetStationTimer();
  updateHero();
  refreshMetadataTarget();

  if(s.type==="external"){
    player.pause();pauseStationTimer();setCenterIcon(false);
    statusMain.innerHTML="<b>Official page</b>";
    if(autoplay) window.open(s.url,"_blank");
    return;
  }

  try{
    await prepareStreamSource(s.url);
  }catch(e){
    setCenterIcon(false);
    statusMain.innerHTML="<b>Unavailable</b>";
    renderStations();
    return;
  }
  if(autoplay) await startPlayback();
}
async function startPlayback(){
  const s=stations[currentIndex];
  if(s.type==="external"){window.open(s.url,"_blank");return}
  statusMain.innerHTML="<b>Connecting…</b>";
  try{
    await player.play();
    setCenterIcon(true);
    statusMain.innerHTML="<b>Live now</b>";
    startStationTimer();
    tryEnableRealVisualizer();
  }catch(e){
    setCenterIcon(false);
    statusMain.innerHTML="<b>Unavailable</b>";
  }
  renderStations();
}
function togglePlay(){
  const s=stations[currentIndex];
  if(s.type==="external"){window.open(s.url,"_blank");return}
  if(player.paused) startPlayback();
  else{
    player.pause();setCenterIcon(false);
    statusMain.innerHTML="<b>Paused</b>";pauseStationTimer();renderStations();
  }
}
function findPlayableIndex(direction){
  const pool=pageIndexes();
  if(!pool.length) return currentIndex;
  let pos=pool.findIndex(x=>x.i===currentIndex);
  if(pos<0) pos=0;
  for(let step=0;step<pool.length;step++){
    pos=(pos+direction+pool.length)%pool.length;
    if(pool[pos].s.type==="stream") return pool[pos].i;
  }
  return currentIndex;
}
function nextStation(){selectStation(findPlayableIndex(1),true)}
function prevStation(){selectStation(findPlayableIndex(-1),true)}

function setSleep(m, btn){
  clearTimeout(sleepTimer);
  clearInterval(sleepCountdown);

  document.querySelectorAll(".sleep button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");

  sleepEndAt = Date.now() + m * 60000;

  const updateSleepCountdown = ()=>{
    const remainingMs = Math.max(0, sleepEndAt - Date.now());
    const remainingMin = Math.ceil(remainingMs / 60000);

    if(remainingMs <= 0){
      clearInterval(sleepCountdown);
      return;
    }

    statusMain.innerHTML=`<b>Sleep · ${remainingMin} min${remainingMin===1?"":"s"} left</b>`;
    statusSub.textContent="Countdown active";
  };

  updateSleepCountdown();
  sleepCountdown = setInterval(updateSleepCountdown, 1000);

  sleepTimer=setTimeout(()=>{
    clearInterval(sleepCountdown);
    document.querySelectorAll(".sleep button").forEach(b=>b.classList.remove("active"));
    powerOffDevice(false);
  },m*60000);
}

/* REAL audio-reactive canvas when the stream permits Web Audio/CORS.
   If a broadcaster blocks analyser access, it falls back to a calm idle display
   without interfering with audio playback. */
async function tryEnableRealVisualizer(){
  // Disabled for direct radio streams.
  // Chrome can mute cross-origin media when routed through Web Audio
  // unless every stream is served with compatible CORS headers.
  analyserReady = false;
}
function drawVisualizer(){
  const w=canvas.width,h=canvas.height;
  const t=(performance.now()/1000)*0.4;
  ctx.clearRect(0,0,w,h);

  const bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,"#123a60");
  bg.addColorStop(1,"#081c31");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);

  if(visualMode===0){
    // 1) Classic spectrum bars
    const bars=20,gap=4,bw=(w-32-(bars-1)*gap)/bars;
    for(let i=0;i<bars;i++){
      const wave=(Math.sin(t*3+i*.62)+1)/2;
      const wave2=(Math.sin(t*1.7+i*.31+1.4)+1)/2;
      const bh=18+(wave*.62+wave2*.38)*(h*.58);
      const x=16+i*(bw+gap), y=h-bh-18;
      const g=ctx.createLinearGradient(0,y,0,h-18);
      g.addColorStop(0,"rgba(220,245,255,.98)");
      g.addColorStop(1,"rgba(75,165,255,.38)");
      ctx.fillStyle=g;
      roundRect(ctx,x,y,bw,bh,Math.min(7,bw/2));ctx.fill();
    }
  } else if(visualMode===1){
    // 2) Mirrored waveform
    ctx.lineWidth=4;
    for(let layer=0;layer<3;layer++){
      ctx.beginPath();
      for(let x=0;x<=w;x+=5){
        const amp=34+layer*15;
        const y=h/2 + Math.sin(x/28+t*(2.6+layer*.4)+layer)*amp*Math.sin(x/150+t);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`rgba(${180-layer*25},${225-layer*8},255,${.9-layer*.22})`;
      ctx.stroke();
    }
    ctx.globalAlpha=.42;
    ctx.save();ctx.translate(0,h);ctx.scale(1,-1);
    ctx.strokeStyle="rgba(110,185,255,.55)";
    ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  } else if(visualMode===2){
    // 3) Radial pulse / equalizer ring
    const cx=w/2,cy=h/2;
    for(let ring=0;ring<3;ring++){
      const base=50+ring*30;
      ctx.beginPath();
      for(let a=0;a<=Math.PI*2+.01;a+=.08){
        const pulse=10*Math.sin(a*6+t*(2+ring*.35))+7*Math.sin(a*11-t*1.4);
        const r=base+pulse;
        const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
        a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle=`rgba(${210-ring*35},${235-ring*12},255,${.88-ring*.2})`;
      ctx.lineWidth=4-ring*.7;ctx.stroke();
    }
    const rg=ctx.createRadialGradient(cx,cy,10,cx,cy,110);
    rg.addColorStop(0,"rgba(210,240,255,.28)");
    rg.addColorStop(1,"rgba(80,160,255,0)");
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,110,0,Math.PI*2);ctx.fill();
  } else if(visualMode===3){
    // 4) Flowing ribbon
    for(let band=0;band<5;band++){
      ctx.beginPath();
      for(let x=0;x<=w;x+=6){
        const y=h*.18+band*h*.15
          +Math.sin(x/42+t*(1.8+band*.12)+band*.9)*26
          +Math.sin(x/19-t*1.15+band)*7;
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`hsla(${195+band*10},88%,${74-band*5}%,${.78-band*.08})`;
      ctx.lineWidth=10-band;ctx.lineCap="round";ctx.stroke();
    }
  } else if(visualMode===4){
    // 5) Floating particles / energy field
    for(let i=0;i<42;i++){
      const px=(i*73.37 + t*(16+(i%5)*6))% (w+50)-25;
      const py=(i*47.83 + Math.sin(t*1.3+i)*42 + h)%h;
      const r=2+(i%5)*1.2;
      const alpha=.25+(i%7)*.07;
      ctx.fillStyle=`rgba(185,225,255,${alpha})`;
      ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
    }
    const cx=w/2+Math.sin(t*.7)*32, cy=h/2+Math.cos(t*.9)*24;
    const rg=ctx.createRadialGradient(cx,cy,8,cx,cy,115);
    rg.addColorStop(0,"rgba(220,245,255,.52)");
    rg.addColorStop(.35,"rgba(95,190,255,.23)");
    rg.addColorStop(1,"rgba(80,150,255,0)");
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,115,0,Math.PI*2);ctx.fill();
  } else if(visualMode===5){
    // 6) Neon tunnel
    const cx=w/2,cy=h/2;
    for(let i=0;i<12;i++){
      const phase=(i/12 + (t*.18))%1;
      const rw=36 + phase*w*.88;
      const rh=22 + phase*h*.72;
      ctx.strokeStyle=`rgba(150,220,255,${.16+(1-phase)*.72})`;
      ctx.lineWidth=1.5+(1-phase)*2.8;
      ctx.strokeRect(cx-rw/2,cy-rh/2,rw,rh);
    }
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4 + t*.12;
      ctx.strokeStyle="rgba(105,190,255,.28)";
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*w*.7,cy+Math.sin(a)*h*.75);ctx.stroke();
    }
  } else if(visualMode===6){
    // 7) Orbital rings
    const cx=w/2,cy=h/2;
    for(let r=0;r<4;r++){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(t*(.45+r*.12)+r*.7);
      ctx.scale(1,.42+r*.05);
      ctx.strokeStyle=`rgba(${190-r*18},${230-r*6},255,${.72-r*.1})`;
      ctx.lineWidth=3-r*.35;
      ctx.beginPath();ctx.arc(0,0,48+r*27,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    for(let i=0;i<8;i++){
      const a=t*(1.2+(i%3)*.16)+i*.79;
      const rr=62+(i%4)*24;
      const x=cx+Math.cos(a)*rr;
      const y=cy+Math.sin(a)*rr*.48;
      ctx.fillStyle=`rgba(220,245,255,${.45+(i%3)*.12})`;
      ctx.beginPath();ctx.arc(x,y,2.3+(i%3),0,Math.PI*2);ctx.fill();
    }
  } else if(visualMode===7){
    // 8) Aurora waves
    for(let layer=0;layer<5;layer++){
      const base=h*.22+layer*h*.13;
      const grad=ctx.createLinearGradient(0,base,w,base+70);
      grad.addColorStop(0,`rgba(85,175,255,${.12+layer*.03})`);
      grad.addColorStop(.5,`rgba(190,235,255,${.28-layer*.025})`);
      grad.addColorStop(1,`rgba(70,155,255,${.08+layer*.02})`);
      ctx.beginPath();
      ctx.moveTo(0,h);
      for(let x=0;x<=w;x+=7){
        const y=base
          +Math.sin(x/54+t*(1.1+layer*.08)+layer*.8)*23
          +Math.sin(x/23-t*.8+layer)*8;
        ctx.lineTo(x,y);
      }
      ctx.lineTo(w,h);ctx.closePath();
      ctx.fillStyle=grad;ctx.fill();
    }
  } else if(visualMode===8){
    // 9) Perspective pulse grid
    ctx.strokeStyle="rgba(115,190,255,.30)";
    ctx.lineWidth=1.4;
    const horizon=h*.42;
    for(let i=0;i<11;i++){
      const p=i/10;
      const y=horizon + Math.pow(p,1.8)*(h-horizon);
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    }
    const cx=w/2;
    for(let i=-8;i<=8;i++){
      ctx.beginPath();
      ctx.moveTo(cx+i*9,horizon);
      ctx.lineTo(cx+i*42,h);
      ctx.stroke();
    }
    const pulseY=horizon + ((Math.sin(t*2.2)+1)/2)*(h-horizon);
    ctx.strokeStyle="rgba(220,245,255,.74)";
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,pulseY);ctx.lineTo(w,pulseY);ctx.stroke();
  } else {
    // 10) Starburst oscilloscope
    const cx=w/2,cy=h/2;
    for(let i=0;i<72;i++){
      const a=(i/72)*Math.PI*2 + t*.22;
      const pulse=.5+.5*Math.sin(i*.73+t*4.2);
      const inner=36+8*Math.sin(i*.41+t*1.8);
      const outer=inner+24+pulse*72;
      ctx.strokeStyle=`rgba(170,225,255,${.18+pulse*.62})`;
      ctx.lineWidth=1.2+pulse*2.4;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner);
      ctx.lineTo(cx+Math.cos(a)*outer,cy+Math.sin(a)*outer);
      ctx.stroke();
    }
    const glow=ctx.createRadialGradient(cx,cy,8,cx,cy,96);
    glow.addColorStop(0,"rgba(225,247,255,.34)");
    glow.addColorStop(1,"rgba(85,165,255,0)");
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,96,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle="rgba(255,255,255,.66)";
  ctx.font="600 18px -apple-system, sans-serif";
  const names=["SPECTRUM","WAVEFORM","RADIAL","RIBBON","PARTICLES","TUNNEL","ORBIT","AURORA","GRID","STARBURST"];
  ctx.fillText(names[visualMode],16,27);

  raf=requestAnimationFrame(drawVisualizer);
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.roundRect(x,y,w,h,r);
}
canvas.addEventListener("click",()=>{
  visualMode=(visualMode+1)%10;
  const labels=["Bars","Waveform","Radial","Ribbon","Particles","Tunnel","Orbit","Aurora","Grid","Starburst"];
  visualHint.textContent="Tap visualizer · "+labels[visualMode];
});
try{ player.volume=Math.max(0,Math.min(1,appVolume)); }catch(e){}
updateVolumeHUD();
resetStationTimer();
ensureIndexOnPage();
updatePageToggle();
selectStation(currentIndex,false);
setCenterIcon(false);
drawVisualizer();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

// ===== Electron desktop bridge =====
if (window.desktopAPI) {
  const pinBtn = document.getElementById("desktopPin");
  const minBtn = document.getElementById("desktopMin");
  const closeBtn = document.getElementById("desktopClose");
  const smallerBtn = document.getElementById("desktopSmaller");
  const largerBtn = document.getElementById("desktopLarger");

  [pinBtn,minBtn,closeBtn,smallerBtn,largerBtn].forEach(btn=>{
    btn?.addEventListener("pointerdown", ()=>{
      btn.dataset.wasPressed="1";
    });
  });

  async function syncAlwaysOnTop(){
    const on = await window.desktopAPI.getAlwaysOnTop();
    pinBtn?.classList.toggle("active", on);
    if(pinBtn) pinBtn.title = `Always on top: ${on ? "On" : "Off"}`;
  }

  pinBtn?.addEventListener("click", async () => {
    const on = await window.desktopAPI.toggleAlwaysOnTop();
    pinBtn.classList.toggle("active", on);
    pinBtn.title = `Always on top: ${on ? "On" : "Off"}`;
  });

  syncAlwaysOnTop();

  minBtn?.addEventListener("click", () => window.desktopAPI.minimize());

  closeBtn?.addEventListener("click", () => {
    try { player.pause(); } catch (_) {}
    window.desktopAPI.quit();
  });

  function resizeAnchorFor(btn){
    if(!btn) return null;
    const r=btn.getBoundingClientRect();
    const vw=Math.max(1,window.innerWidth);
    const vh=Math.max(1,window.innerHeight);
    return {
      x:(r.left+r.width/2)/vw,
      y:(r.top+r.height/2)/vh
    };
  }

  // Keep the clicked +/- button under the cursor after every resize.
  // This lets repeated clicks continue without repositioning the mouse.
  smallerBtn?.addEventListener("click", () => {
    window.desktopAPI.changeSize(-1, resizeAnchorFor(smallerBtn));
  });
  largerBtn?.addEventListener("click", () => {
    window.desktopAPI.changeSize(1, resizeAnchorFor(largerBtn));
  });

  document.addEventListener("keydown", (e) => {
    if (!e.ctrlKey) return;
    if (e.key === "-" || e.key === "_") {
      e.preventDefault();
      window.desktopAPI.changeSize(-1);
    }
    if (e.key === "=" || e.key === "+") {
      e.preventDefault();
      window.desktopAPI.changeSize(1);
    }
  });

  window.desktopAPI.onCommand((cmd) => {
    if (cmd === "playPause") togglePlay();
    if (cmd === "next") nextStation();
    if (cmd === "previous") prevStation();
  });
}
